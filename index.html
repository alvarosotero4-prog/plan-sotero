<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6A45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan Sotero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plan Sotero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one column under a sticky tab bar. Cards hold totals and forms; a timeline grid shows the week. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface2:#E6ECE5; --ink:#14211A; --ink2:#52645A; --line:#D2DBD1;
  --accent:#1D6A45; --accent-ink:#FFFFFF; --accent-soft:#D4EADA;
  --p:#2C6DCE; --c:#C77F12; --g:#BF3F66;
  --good:#1B7F4B; --warn:#A8660A; --bad:#BA3434;
  --t-football:#1D6A45; --t-kids:#2C6DCE; --t-strength:#7048BD; --t-meal:#C77F12; --t-rest:#718078;
  --t-work:#456A8C; --t-free:#2F9393; --t-prep:#8C9A92; --t-sleep:#33405E; --t-wake:#8C9A92;
  --font-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-b:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1511; --surface:#16211A; --surface2:#1F2D24; --ink:#E6EEE8; --ink2:#9DB0A3; --line:#2B3B31;
    --accent:#57C089; --accent-ink:#08170F; --accent-soft:#1B3A29;
    --p:#6EA4F4; --c:#E9AB4C; --g:#F07C9C;
    --good:#5CC58C; --warn:#E3A24A; --bad:#EE7B7B;
    --t-football:#4DB27F; --t-kids:#6EA4F4; --t-strength:#A98BEA; --t-meal:#E0A04A; --t-rest:#8EA096;
    --t-work:#79A0C6; --t-free:#59BDBD; --t-prep:#7E8F85; --t-sleep:#7F90BF; --t-wake:#7E8F85;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16211A; --surface2:#1F2D24; --ink:#E6EEE8; --ink2:#9DB0A3; --line:#2B3B31;
  --accent:#57C089; --accent-ink:#08170F; --accent-soft:#1B3A29;
  --p:#6EA4F4; --c:#E9AB4C; --g:#F07C9C;
  --good:#5CC58C; --warn:#E3A24A; --bad:#EE7B7B;
  --t-football:#4DB27F; --t-kids:#6EA4F4; --t-strength:#A98BEA; --t-meal:#E0A04A; --t-rest:#8EA096;
  --t-work:#79A0C6; --t-free:#59BDBD; --t-prep:#7E8F85; --t-sleep:#7F90BF; --t-wake:#7E8F85;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-b);padding-inline:16px;padding-block:0 72px;-webkit-text-size-adjust:100%}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:21px;line-height:1.15}
h3{font-size:17px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink2);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header + tabs */
.top{padding-top:18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px}
.top .sub{flex-basis:100%}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px 3px 3px;font-weight:500;font-size:14px;max-width:46%;min-width:0}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:16px;flex:none;text-transform:uppercase}
.brand h1{font-size:30px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.mark{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sub{color:var(--ink2);font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px 9px;white-space:nowrap;font-family:var(--font-d);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* cards + generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.k-f{background:var(--accent-soft);color:var(--accent)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.inp{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.inp input,.inp input[type=text],.inp input[type=time]{border:0;border-radius:0;background:none;padding:8px 0;width:72px;font-variant-numeric:tabular-nums;text-align:right}
.inp input:focus-visible{outline:none}
.inp:focus-within{border-color:var(--accent)}
.inp span{color:var(--ink2);font-size:13px}
input[type=text],input[type=time],input[type=email],input[type=password],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}

/* week strip */
.stripbar{display:flex;align-items:stretch;gap:6px}
.strip{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:0}
.dchip{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}
.dchip .dl{font-size:11px;color:var(--ink2);font-weight:600}
.dchip .dn{font-family:var(--font-d);font-size:21px;font-weight:600;line-height:1}
.dchip .dk{width:6px;height:6px;border-radius:50%;background:var(--ink2);opacity:.45}
.dchip .dk.k-f{background:var(--accent);opacity:1}
.dchip i{position:absolute;left:0;bottom:0;height:4px;width:var(--h);background:var(--accent)}
.dchip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dchip.today .dn{color:var(--accent)}
.arrow{width:34px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:18px;color:var(--ink2)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dayhead h2{font-size:26px}
.dayhead p{color:var(--ink2);font-size:14px}

/* totals */
.big{font-family:var(--font-d);font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--ink2);font-weight:500}
.meter{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter.over i{background:var(--warn)}
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mac{display:flex;flex-direction:column;gap:5px}
.mac b{font-family:var(--font-d);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.mac b small{font-size:14px;color:var(--ink2);font-weight:500}
.mac .l{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.mac.p i{background:var(--p)} .mac.c i{background:var(--c)} .mac.g i{background:var(--g)}
.plan-line{font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}

/* schedule list */
.sched{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.srow{--tc:var(--t-prep);border-left:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface));border-radius:6px}
.srow.t-football{--tc:var(--t-football)} .srow.t-kids{--tc:var(--t-kids)} .srow.t-strength{--tc:var(--t-strength)}
.srow.t-meal{--tc:var(--t-meal)} .srow.t-rest{--tc:var(--t-rest)} .srow.t-work{--tc:var(--t-work)}
.srow.t-free{--tc:var(--t-free)} .srow.t-prep{--tc:var(--t-prep)} .srow.t-sleep{--tc:var(--t-sleep)} .srow.t-wake{--tc:var(--t-wake)}
.srow label,.srow .in{display:grid;grid-template-columns:auto 50px 1fr;align-items:center;gap:10px;padding:7px 10px;min-width:0}
.srow .in{grid-template-columns:50px 1fr auto}
.srow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.srow .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.srow .tx{min-width:0;overflow-wrap:anywhere}
.srow em{font-style:normal;color:var(--ink2);font-size:12px;margin-left:6px;white-space:nowrap}
.srow .ty{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.srow input:checked ~ .tx{text-decoration:line-through;opacity:.55}

/* week table */
.wt{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.wrow .d{font-family:var(--font-d);font-size:19px;font-weight:600}
.wrow .bar{display:flex;flex-direction:column;gap:3px;min-width:0}
.wrow .bar span{font-size:12px;color:var(--ink2)}
.wrow .kg{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2);min-width:56px;text-align:right}

/* meal slots */
.slot{display:flex;flex-direction:column;gap:10px}
.slot .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.slot .hd h3 span{font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--ink2);margin-left:6px}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ent .n{min-width:0}
.ent .n b{font-weight:500}
.ent .n small{display:block;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.ent .inp input[type=text]{width:56px}
.ent .x{background:none;border:0;color:var(--ink2);font-size:18px;padding:2px 6px}
.ghost{color:var(--ink2);font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.pick{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pick input{width:100%}
.picklist{max-height:236px;overflow:auto;display:flex;flex-direction:column}
.picklist button{display:flex;justify-content:space-between;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 4px;text-align:left}
.picklist button:hover{background:var(--surface2)}
.picklist small{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* weight */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat .l{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-family:var(--font-d);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--ink2);font-weight:500}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:520px;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.tx2{fill:var(--ink2);font:11px var(--font-b)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;vertical-align:middle;margin-right:6px}
.legend .a::before{width:8px;height:8px;border-radius:50%;background:var(--ink2)}
.legend .b::before{width:16px;height:3px;background:var(--accent)}
.legend .c::before{width:16px;border-top:2px dashed var(--ink2)}
.rec{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rec.warn{border-left-color:var(--warn)}
details.week{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.week summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;font-family:var(--font-d);font-size:19px;font-weight:600;list-style-position:inside}
details.week summary span{font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--ink2)}
.wk{width:100%;border-collapse:collapse}
.wk th,.wk td{padding:6px 14px;text-align:left;border-top:1px solid var(--line);font-size:14px}
.wk th{font-weight:500;color:var(--ink2);font-size:13px}
.wk .inp input[type=text]{width:60px}

/* routine */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gin{min-width:780px;display:grid;grid-template-columns:42px repeat(7,1fr)}
.gh{padding:8px 6px;font-family:var(--font-d);font-size:16px;font-weight:600;text-align:center;border-bottom:1px solid var(--line);background:var(--surface)}
.gh small{display:block;font-family:var(--font-b);font-size:11px;font-weight:500;color:var(--ink2)}
.gt{position:relative;height:680px;border-right:1px solid var(--line)}
.gt span{position:absolute;right:5px;font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums;transform:translateY(-6px)}
.gc{position:relative;height:680px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.blk{--tc:var(--t-prep);position:absolute;left:2px;right:2px;border-left:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 22%,var(--surface));border-radius:4px;padding:1px 4px;font-size:10.5px;line-height:1.2;overflow:hidden}
.blk b{font-variant-numeric:tabular-nums}
.t-football.blk{--tc:var(--t-football)} .t-kids.blk{--tc:var(--t-kids)} .t-strength.blk{--tc:var(--t-strength)}
.t-meal.blk{--tc:var(--t-meal)} .t-rest.blk{--tc:var(--t-rest)} .t-work.blk{--tc:var(--t-work)}
.t-free.blk{--tc:var(--t-free)} .t-prep.blk{--tc:var(--t-prep)} .t-sleep.blk{--tc:var(--t-sleep)} .t-wake.blk{--tc:var(--t-wake)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--tc)}

/* plan */
.tgt{width:100%;border-collapse:collapse}
.tgt th,.tgt td{padding:6px 8px;text-align:left;border-top:1px solid var(--line);font-size:14px}
.tgt th{font-weight:500;color:var(--ink2)}
.tgt thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tgt .inp input[type=text]{width:58px}
.scroll{overflow-x:auto}
.mrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding-top:10px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:0}
.mh{display:flex;flex-direction:column;min-width:0}
.mc{display:flex;align-items:center;gap:12px}
.chk{display:flex;align-items:center;gap:6px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.inp input[type=time]{width:118px;text-align:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.form input{width:100%}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
@media (max-width:520px){
  .big{font-size:40px}
  .dayhead h2{font-size:23px}
  .tabs button{font-size:14px;letter-spacing:0;padding-inline:4px}
}
@media (prefers-reduced-motion:no-preference){ .meter i{transition:width .25s ease} }

.chartbox.fit svg{min-width:0}
.stp{display:flex;align-items:center;gap:4px}
.sb{width:30px;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-size:18px;line-height:1;padding:0}
.sb:hover{border-color:var(--accent)}
.ent .inp input[type=text]{width:46px}
input[type=date]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;color:var(--ink)}
select{max-width:100%}
.scan{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.scan video{width:100%;max-width:520px;max-height:68vh;object-fit:cover;border-radius:10px;background:#111}
.scan p{margin:0;text-align:center}

.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.setr{display:grid;grid-template-columns:20px 1fr 1fr auto;align-items:center;gap:8px}
.setr .inp input[type=text]{width:100%;min-width:0;text-align:right}
.setr .inp{min-width:0}
.rt{display:flex;flex-direction:column;gap:6px}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.rate button{height:34px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font-variant-numeric:tabular-nums;padding:0;font-size:13px}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);resize:vertical;font:inherit}
.mrow2{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;align-items:center}
.mrow2 .num{grid-column:2;font-size:12px}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.sbar i{display:block;height:100%}

.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-align:center;color:var(--accent-ink)!important;font-size:14px!important}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp select{width:100%}
.cmp img,.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--surface2);display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gal figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.gal figcaption{font-size:12px}

/* perfiles y cuestionario */
.opts{display:grid;gap:8px}

var PALL=['pollo','pavo','merluza','salmon','atun','ternera','huevo','tofu','soja_tex','legumbres'];
function clampG(g,lo,hi,f){

function solveRecipe(rec,kT,pT,ok){

    if(!id&&s.r==='P')for(i=0;i<PALL.length;i++)if(ok(PALL[i])){id=PALL[i];break;}
    var f=id&&findFood(id);if(!f)return;

  });
  var P=it.filter(function(x){return x.r==='P';})[0],C=it.filter(function(x){return x.r==='C';})[0];

/* Horario: despertar, comidas repartidas, entreno, bloque de trabajo y sueño */
function r15(x){return Math.round(x/15)*15;}
function mealTimes(a,train){
  var wake=a.wake,bed=a.bed,ts=a.ttime,dur=a.dur||60,te=ts+dur;
  var bf=r15(wake+45),lu=r15(Math.max(840,wake+270)),di=r15(Math.min(1350,Math.max(lu+300,bed-150)));
  var T={breakfast:bf,lunch:lu,dinner:di,snack:r15((lu+di)/2),mid:r15((bf+lu)/2)};
  var res=G.slots.map(function(s){return {id:s.id,t:T[s.id],tag:''};});
  if(!train)return res;
  function inWin(t){return t>ts-45&&t<te+15;}
  res.forEach(function(m){
    if(!inWin(m.t))return;
    if(m.t<=ts+dur/3&&ts-75>=wake+10){m.t=ts-75;m.tag='pre';}else{m.t=te+30;m.tag='post';}
  });
  res.sort(function(x,y){return x.t-y.t;});
  for(var pass=0;pass<3;pass++)for(var i=1;i<res.length;i++){
    if(res[i].t-res[i-1].t<75)res[i].t=res[i-1].t+75;
    if(inWin(res[i].t)&&res[i].tag!=='pre'){res[i].t=te+30;res[i].tag='post';}
  }
  res.sort(function(x,y){return x.t-y.t;});
  return res;
}
function carve(s,e,busy){
  var b=busy.slice().sort(function(x,y){return x[0]-y[0];}),cur=s,out=[];
  b.forEach(function(x){if(x[1]<=cur||x[0]>=e)return;if(x[0]-cur>=45)out.push([cur,x[0]]);cur=Math.max(cur,x[1]);});
  if(e-cur>=45)out.push([cur,e]);
  return out;
}
function overlaps(s,e,busy){return busy.some(function(x){return s<x[1]&&e>x[0];});}
function schedGen(d){
  var a=G.a,w=wdOf(d),train=!!a.days[w],rows=[],ms=mealTimes(a,train),ts=a.ttime,dur=a.dur||60,te=ts+dur,busy=[],lastMeal=0;
  rows.push(R(a.wake,null,'Despertar, agua y peso en ayunas','wake'));
  ms.forEach(function(m){
    var len=(m.id==='lunch'||m.id==='dinner')?45:30;
    rows.push(R(m.t,m.t+len,SLOT_ALL[m.id]+(m.tag==='pre'?' (antes de entrenar)':m.tag==='post'?' (después de entrenar)':''),'meal',m.id));
    busy.push([m.t,m.t+len]);lastMeal=Math.max(lastMeal,m.t+len);
  });
  if(train){
    rows.push(R(ts-10,ts,'Calentamiento y movilidad','strength'),R(ts,te,sessName(),'strength'),R(te,te+30,'Ducha y recuperación','prep'));
    busy.push([ts-10,te+30]);
  }
  if(a.work&&a.wdays[w])carve(a.ws,a.we,busy).forEach(function(x){rows.push(R(x[0],x[1],'Trabajo o estudio','work'));busy.push(x);});
  if(!train){for(var t0=1050;t0<=a.bed-150;t0+=15)if(!overlaps(t0,t0+30,busy)){rows.push(R(t0,t0+30,'Paseo de 30 minutos','free'));busy.push([t0,t0+30]);break;}}
  if(lastMeal+20<a.bed-45)rows.push(R(lastMeal+15,lastMeal+35,'Preparar comidas y ropa de mañana','prep'));
  rows.push(R(a.bed-30,a.bed,'Sin pantallas y a dormir','sleep'));
  return rows.sort(function(x,y){return x.s-y.s;});
}

function recGen(w,dl,b){
  var p=G.pace,ab=f1(Math.abs(dl)),m='La media de la semana '+(w+1)+' ('+f1(b.mean)+' kg) ';
  if(G.goal==='bajar'){
    if(dl>p*0.67)return {w:w,dl:dl,kind:'cut',msg:m+(dl>0.05?'subió '+ab+' kg':'bajó solo '+ab+' kg')+' respecto a la anterior, menos de lo previsto. Resta 150 kcal a los objetivos (baja un poco los carbohidratos).'};
    if(dl<p*2)return {w:w,dl:dl,kind:'add',msg:m+'bajó '+ab+' kg, más rápido de lo previsto. Suma 200 kcal con carbohidratos para no perder músculo ni rendimiento.'};
    return {w:w,dl:dl,kind:'ok',msg:m+'bajó '+ab+' kg. El ritmo es el previsto: mantén las calorías.'};
  }
  if(G.goal==='subir'){
    if(dl<p*0.4)return {w:w,dl:dl,kind:'add',msg:m+(dl<-0.05?'bajó '+ab+' kg':'subió solo '+ab+' kg')+', menos de lo previsto. Suma 200 kcal a los objetivos (más carbohidratos).'};
    if(dl>p*2.2)return {w:w,dl:dl,kind:'cut',msg:m+'subió '+ab+' kg, más rápido de lo previsto: parte puede ser grasa. Resta 150 kcal a los objetivos.'};
    return {w:w,dl:dl,kind:'ok',msg:m+'subió '+ab+' kg. El ritmo es el previsto: mantén las calorías.'};
  }
  if(dl>0.4)return {w:w,dl:dl,kind:'cut',msg:m+'subió '+ab+' kg. Para mantener el peso, resta 150 kcal a los objetivos.'};
  if(dl<-0.4)return {w:w,dl:dl,kind:'add',msg:m+'bajó '+ab+' kg. Para mantener el peso, suma 200 kcal a los objetivos.'};

function recommendation(ws){
  for(var w=3;w>=1;w--){
    var a=ws[w-1],b=ws[w];
    if(a.mean!=null&&b.mean!=null&&a.n>=3&&b.n>=3){
      var dl=b.mean-a.mean;

      if(dl<-0.6) return {w:w,dl:dl,kind:'add',msg:'La media de la semana '+(w+1)+' ('+f1(b.mean)+' kg) bajó '+f1(Math.abs(dl))+' kg, más rápido de lo previsto. Suma 200 kcal con pan o fruta en la merienda para no perder músculo.'};
      return {w:w,dl:dl,kind:'ok',msg:'La media de la semana '+(w+1)+' bajó '+f1(Math.abs(dl))+' kg. El ritmo es el previsto: mantén las calorías.'};

var TAGS=['Comí fuera','Antojo','Hambre alta','Poco sueño','Buen día','Mal día'];

function streak(test){
  var d=todayS(),n=0,i;
  if(!test(d))d=addDays(d,-1);
  for(i=0;i<90;i++){if(test(d)){n++;d=addDays(d,-1);}else break;}
  return n;
}
function dayOkProt(d){var n=dayN(d);return n.kcal>0&&n.p>=S.settings.t[dayKind(d)].p*0.9;}
function waterGoal(d){return S.settings.kg*0.0375+(dayKind(d)==='f'?0.5:0);}
function goalRow(label,v,g){return '<div class="mac"><div class="hrow"><span>'+label+'</span><b class="num">'+v+' / '+g+'</b></div>'+meter(Math.min(v,g),g)+'</div>';}
function trainedOn(x){
  if(sessionSum(x).sets>=2)return true;
  var tr=S.track[x];if(tr&&tr.cardio>0)return true;
  var ck=S.checks[x]||{},hit=false;
  sched(x).forEach(function(r,i){if(r.type==='strength'&&ck[i])hit=true;});
  return hit;
}
function constCard(d){
  var sK=streak(function(x){return dayN(x).kcal>0;}),sW=streak(function(x){return S.weights[x]!=null;}),sP=streak(dayOkProt);
  var mon=mondayOf(d),dw=0,dk=0,dp=0,dl=0,da=0,i,x;
  for(i=0;i<7;i++){x=addDays(mon,i);if(S.weights[x]!=null)dw++;if(dayN(x).kcal>0)dk++;if(dayOkProt(x))dp++;if(isSot()?sessionSum(x).sets>=2:trainedOn(x))dl++;var tr=S.track[x];if(tr&&tr.water!=null&&tr.water>=waterGoal(x))da++;}
  return '<section class="card"><h2>Constancia</h2><div class="stats">'+
    '<div class="stat"><div class="l">Racha de comidas</div><div class="v">'+sK+' <small>días</small></div></div>'+
    '<div class="stat"><div class="l">Racha de peso</div><div class="v">'+sW+' <small>días</small></div></div>'+
    '<div class="stat"><div class="l">Racha de proteína</div><div class="v">'+sP+' <small>días</small></div></div></div>'+
    '<h3>Metas de la semana del '+rangeLabel(mon,addDays(mon,6))+'</h3><div class="macros">'+
    goalRow('Peso apuntado',dw,7)+goalRow('Días con comidas',dk,6)+goalRow('Proteína en objetivo',dp,5)+(isSot()?goalRow('Sesiones de fuerza',dl,2):(G.nTrain?goalRow('Entrenos hechos',dl,G.nTrain):''))+goalRow('Agua en objetivo',da,5)+'</div></section>';
}
function trackCard(d){
  var T=S.track[d]||{},kc=dayKind(d),goal=Math.round((S.settings.kg*0.0375+(kc==='f'?0.5:0))*10)/10,w=T.water!=null?T.water:0;
  return '<section class="card"><h2>Seguimiento del día</h2>'+
    '<div class="hrow"><label for="tw">Agua</label><div class="inp"><input id="tw" type="text" inputmode="decimal" data-bind="track" data-k="water" data-d="'+d+'" value="'+(T.water!=null?f2(T.water):'')+'" placeholder="0"><span>L</span></div></div>'+
    meter(w,goal)+'<p class="muted">Objetivo ≈ '+f1(goal)+' L ('+(kc==='f'?kLabel('f').toLowerCase()+', con 0,5 L extra':kLabel('r').toLowerCase())+').</p>'+
    '<div class="btns"><button class="btn sm" data-act="water" data-d="'+d+'" data-n="0.25">+250 ml</button><button class="btn sm" data-act="water" data-d="'+d+'" data-n="0.5">+500 ml</button><button class="btn sm" data-act="water" data-d="'+d+'" data-n="-0.25">−250 ml</button></div>'+
    '<div class="hrow"><label for="tst">Pasos</label><div class="inp"><input id="tst" type="text" inputmode="numeric" data-bind="track" data-k="steps" data-d="'+d+'" value="'+(T.steps!=null?Math.round(T.steps):'')+'" placeholder="—"><span>pasos</span></div></div>'+
    '<div class="hrow"><label for="tcd">'+(isSot()?'Cardio aparte del fútbol':'Cardio extra')+'</label><div class="inp"><input id="tcd" type="text" inputmode="numeric" data-bind="track" data-k="cardio" data-d="'+d+'" value="'+(T.cardio!=null?Math.round(T.cardio):'')+'" placeholder="—"><span>min</span></div></div>'+
    '<label class="hrow chk" style="cursor:pointer"><span>Creatina de hoy (3–5 g)</span><input type="checkbox" data-bind="track" data-k="creatine" data-d="'+d+'"'+(T.creatine?' checked':'')+'></label>'+
    '<div class="hrow"><label for="ts">Sueño de anoche (objetivo 7,5–8 h)</label><div class="inp"><input id="ts" type="text" inputmode="decimal" data-bind="track" data-k="sleep" data-d="'+d+'" value="'+(T.sleep!=null?f1(T.sleep):'')+'" placeholder="—"><span>h</span></div></div></section>';
}
function vHoy(){

function stepOf(f){return f&&f.piece?f.piece:(f&&f.id==='aceite'?5:10);}
function entryRow(d,slot,e,i){
  var f=findFood(e.f),n=nut(e),nm=f?f.name:'Alimento borrado';
  var units=f&&f.piece?' · '+f1(e.g/f.piece)+' ud (1 ud ≈ '+f.piece+' g)':'';

  return '<div class="ent"><div class="n"><b>'+esc(nm)+'</b><small>'+f0(n.kcal)+' kcal · P '+f1(n.p)+' · C '+f1(n.c)+' · G '+f1(n.g)+esc(units)+'</small></div>'+
    '<div class="stp"><button class="sb" data-act="step" data-dir="-1" '+at+' aria-label="Menos '+esc(nm)+'">−</button><div class="inp"><input type="text" inputmode="decimal" data-bind="g" '+at+' value="'+f0(e.g)+'" aria-label="Gramos de '+esc(nm)+'"><span>g</span></div><button class="sb" data-act="step" data-dir="1" '+at+' aria-label="Más '+esc(nm)+'">+</button></div>'+

function pickList(d,slot){
  var q=(ui.q||'').toLowerCase().trim(),l=foods().filter(function(f){return !q||f.name.toLowerCase().indexOf(q)>-1;});
  if(!l.length) return '<p class="muted" style="padding:8px 4px">No hay ningún alimento con ese nombre. Puedes crearlo en la pestaña Alimentos.</p>';
  return l.map(function(f){return '<button data-act="pick" data-d="'+d+'" data-s="'+slot+'" data-f="'+esc(f.id)+'"><span>'+esc(f.name)+'</span><small>'+f0(f.kcal)+' kcal/100 g</small></button>';}).join('');
}

function offName(p){var n=(p.product_name||'').trim(),b=(p.brands||'').split(',')[0].trim();return n?(b&&n.toLowerCase().indexOf(b.toLowerCase())<0?n+' ('+b+')':n):'';}
function offKcal(n){var k=n['energy-kcal_100g'];if(typeof k!=='number'||!isFinite(k)){var kj=n['energy_100g'];if(typeof kj==='number'&&isFinite(kj))k=kj/4.184;else return null;}return k;}
function offHTML(d,slot){
  var o=ui.off;
  if(o.status==='loading')return '<p class="muted">Buscando en Mercadona…</p>';
  if(o.status==='error')return '<p class="muted">No se pudo buscar ahora mismo (la base de datos no responde o no hay conexión). Los productos más habituales ya están en la lista; el resto puedes crearlos en la pestaña Alimentos.</p>';
  if(o.status==='empty')return '<p class="muted">No hay ningún producto con ese nombre o código y datos nutricionales. Prueba con otra palabra o crea el alimento en la pestaña Alimentos.</p>';
  if(o.status!=='ok')return '<p class="muted">Escribe el producto y pulsa Buscar en Mercadona, o escanea el código de barras. También puedes escribir el código en el buscador. Los datos vienen de Open Food Facts y pueden tener errores: revisa la etiqueta.</p>';
  return '<div class="picklist">'+o.list.map(function(x,i){return '<button data-act="offpick" data-d="'+d+'" data-s="'+slot+'" data-i="'+i+'"><span>'+esc(x.name)+'</span><small>'+f0(x.kcal)+' kcal · P '+f1(x.p)+' · C '+f1(x.c)+' · G '+f1(x.g)+'</small></button>';}).join('')+'</div><p class="muted">Valores por 100 g, de Open Food Facts. Revisa la etiqueta.</p>';
}
function offSearch(d,slot){
  var q=(ui.q||'').trim();
  if(q.length<2){toast('Escribe al menos 2 letras');return;}
  ui.off={status:'loading',list:[],q:q};var box=document.getElementById('offres');if(box)box.innerHTML=offHTML(d,slot);
  var enc=encodeURIComponent,urls=[
    'https://world.openfoodfacts.org/cgi/search.pl?action=process&json=1&page_size=30&search_simple=1&search_terms='+enc(q)+'&tagtype_0=stores&tag_contains_0=contains&tag_0=mercadona&fields=code,product_name,brands,nutriments',
    'https://search.openfoodfacts.org/search?q='+enc(q+' stores_tags:mercadona')+'&page_size=30&fields=code,product_name,brands,nutriments',
    'https://world.openfoodfacts.org/cgi/search.pl?action=process&json=1&page_size=30&search_simple=1&search_terms='+enc(q+' mercadona')+'&fields=code,product_name,brands,stores,nutriments'
  ],last=urls.length-1;
  function parse(j){
    var seen={},list=[],arr=(j&&(j.products||j.hits))||[];
    arr.forEach(function(p){
      var n=p.nutriments||{},k=offKcal(n),name=offName(p);
      if(!name||k==null||!p.code||seen[p.code])return;seen[p.code]=1;
      list.push({code:p.code,name:name,kcal:Math.round(k),p:+n['proteins_100g']||0,c:+n['carbohydrates_100g']||0,g:+n['fat_100g']||0});
    });
    return list;
  }
  function one(url){
    var ctl=typeof AbortController!=='undefined'?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();},12000);
    return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('http');return r.json();},function(e){clearTimeout(tm);throw e;});
  }
  function attempt(i){
    return one(urls[i]).then(function(j){var l=parse(j);return (l.length||i>=last)?l:attempt(i+1);},function(err){if(i<last)return attempt(i+1);throw err;});
  }
  function done(list){ui.off={status:list.length?'ok':'empty',list:list,q:q};}
  function fail(){ui.off={status:'error',list:[],q:q};}
  function paint(){var b2=document.getElementById('offres');if(b2)b2.innerHTML=offHTML(d,slot);}
  if(/^\d{8,14}$/.test(q)){
    one('https://world.openfoodfacts.org/api/v2/product/'+enc(q)+'.json?fields=code,product_name,brands,nutriments').then(function(j){
      var pr=j&&j.product;if(!pr)return [];pr.code=pr.code||q;return parse({products:[pr]});
    }).then(done,fail).then(paint);
    return;
  }
  attempt(0).then(done,fail).then(paint);
}
function mealN(m){return slotN(m.items);}

function slotCard(d,s,k){

  if(ui.picker===s.id) h+='<div class="pick">'+mealChips(d,s.id)+'<input type="text" id="q" placeholder="Buscar alimento o escribir código de barras" value="'+esc(ui.q)+'" autocomplete="off"><div class="picklist" id="picklist">'+pickList(d,s.id)+'</div><div class="btns"><button class="btn sm" data-act="offsearch" data-d="'+d+'" data-s="'+s.id+'">Buscar en Mercadona</button><button class="btn sm" data-act="scan" data-d="'+d+'" data-s="'+s.id+'">Escanear código</button></div><div id="offres">'+offHTML(d,s.id)+'</div></div>';
  return h+'</section>';
}

function chartSVG(ws){

function startScan(d,slot){
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Este navegador no puede escanear. Escribe el código de barras en el buscador y pulsa Buscar.');return;}
  var det;try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});}catch(e){toast('Este navegador no puede escanear. Escribe el código en el buscador.');return;}
  var ov=document.createElement('div');ov.className='scan';
  ov.innerHTML='<video playsinline muted></video><p>Apunta al código de barras del producto</p><button class="btn main" id="scx">Cancelar</button>';
  document.body.appendChild(ov);
  var video=ov.querySelector('video'),stream=null,alive=true;
  function stop(){alive=false;if(stream)stream.getTracks().forEach(function(t){t.stop();});ov.remove();}
  document.getElementById('scx').onclick=stop;
  function loop(){
    if(!alive)return;
    det.detect(video).then(function(codes){
      if(!alive)return;
      if(codes&&codes.length&&codes[0].rawValue){var c=codes[0].rawValue;stop();ui.q=c;var qi=document.getElementById('q');if(qi)qi.value=c;offSearch(d,slot);}
      else setTimeout(loop,250);
    },function(){setTimeout(loop,400);});
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){
    stream=s;if(!alive){s.getTracks().forEach(function(t){t.stop();});return;}
    video.srcObject=s;return video.play();
  }).then(function(){loop();}).catch(function(){stop();toast('No se pudo abrir la cámara. Permite el acceso o escribe el código.');});
}

  function x(d){return pts.length===1?W/2:pl+14+(W-pl-pr-28)*diffDays(d,t0)/span;}

  case 'obwork':readOb();render();return true;
  case 'obback':readOb();ob.err='';ob.step=Math.max(0,ob.step-1);render();toTop();return true;
  case 'obgo':
    readOb();ob.err=obValidate(ob.step);
    if(!ob.err)ob.step++;
    render();toTop();return true;
  case 'obcreate':
    readOb();
    for(i=0;i<=5;i++){var er=obValidate(i);if(er){ob.step=i;ob.err=er;render();toTop();return true;}}
    if(ob.edit){saveEdit();ob=null;ui.screen=null;ui.tab='plan';render();toTop();toast('Plan actualizado');}
    else if(createProfile()){ob=null;ui.screen=null;render();toTop();toast('Perfil creado');}
    return true;
  }
  return false;
}

    if(q.access_token&&q.type==='recovery'){history.replaceState(null,'',location.pathname+location.search);return {access:q.access_token,refresh:q.refresh_token||'',expires:+q.expires_in||3600};}
    if(q.error_description){history.replaceState(null,'',location.pathname+location.search);ui.authMsg={k:'err',t:'El enlace ha caducado o no es válido. Pide uno nuevo desde "He olvidado la contraseña".'};}

  INDEX=loadIndex();
  if(!(INDEX.active&&activate(INDEX.active))){INDEX.active=null;PROF=null;ui.screen=INDEX.list.length?'profiles':'welcome';}
  render();
}
boot();
document.addEventListener('visibilitychange',function(){
  if(!cloudOn()||!AUTH||!INDEX)return;
  if(document.hidden){syncPush();return;}
  if(Date.now()-pullAt>30000)syncPull().then(function(ch){if(ch&&!ui.screen)render();});
});
window.addEventListener('online',function(){if(cloudOn()&&AUTH&&INDEX){syncPush();syncPull().then(function(ch){if(ch&&!ui.screen)render();});}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}catch(e){}
})();
</script>
</body>
