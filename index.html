<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062C33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tupla">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tupla</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one column under a sticky tab bar. Cards hold totals and forms; a timeline grid shows the week. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --surface2:#E9EEF4; --ink:#0E1D2C; --ink2:#586A7E; --line:#E0E7EF;
  --accent:#087454; --accent2:#0A8A63; --accent-ink:#FFFFFF; --accent-soft:#DAF3E8;
  --p:#3563E9; --c:#E08A00; --g:#D93A73;
  --good:#0E8A55; --warn:#B26A00; --bad:#C23A3A;
  --hero1:#062C33; --hero2:#0A5A4D; --hero3:#13A878; --mango:#FFC857; --coral:#FF7A59;
  --t-football:#087454; --t-kids:#3563E9; --t-strength:#7048BD; --t-meal:#E08A00; --t-rest:#7C8CA0;
  --t-work:#456A8C; --t-free:#1F9AA0; --t-prep:#94A3B5; --t-sleep:#33405E; --t-wake:#94A3B5;
  --font-d:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121A; --surface:#101C27; --surface2:#182735; --ink:#E7EFF6; --ink2:#8DA2B6; --line:#1F3141;
    --accent:#34D399; --accent2:#6EE7B7; --accent-ink:#04251A; --accent-soft:#0F3A2E;
    --p:#7FA2FF; --c:#FBBF47; --g:#F472A0;
    --good:#4ADE9A; --warn:#F2B04D; --bad:#F27D7D;
    --hero1:#04161B; --hero2:#0A4A44; --hero3:#118A66;
    --t-football:#34D399; --t-kids:#7FA2FF; --t-strength:#B49CF2; --t-meal:#F2B04D; --t-rest:#8EA2B6;
    --t-work:#7FA6CC; --t-free:#4FC3C8; --t-prep:#7C8FA3; --t-sleep:#8294C4; --t-wake:#7C8FA3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121A; --surface:#101C27; --surface2:#182735; --ink:#E7EFF6; --ink2:#8DA2B6; --line:#1F3141;
  --accent:#34D399; --accent2:#6EE7B7; --accent-ink:#04251A; --accent-soft:#0F3A2E;
  --p:#7FA2FF; --c:#FBBF47; --g:#F472A0;
  --good:#4ADE9A; --warn:#F2B04D; --bad:#F27D7D;
  --hero1:#04161B; --hero2:#0A4A44; --hero3:#118A66;
  --t-football:#34D399; --t-kids:#7FA2FF; --t-strength:#B49CF2; --t-meal:#F2B04D; --t-rest:#8EA2B6;
  --t-work:#7FA6CC; --t-free:#4FC3C8; --t-prep:#7C8FA3; --t-sleep:#8294C4; --t-wake:#7C8FA3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-b);padding-inline:16px;padding-block:0 72px;-webkit-text-size-adjust:100%}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:21px;line-height:1.15}
h3{font-size:17px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink2);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header + tabs */
.top{padding-top:18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px}
.top .sub{flex-basis:100%}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px 3px 3px;font-weight:500;font-size:14px;max-width:46%;min-width:0}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:16px;flex:none;text-transform:uppercase}
.brand h1{font-size:30px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.mark{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sub{color:var(--ink2);font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px 9px;white-space:nowrap;font-family:var(--font-d);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* cards + generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.k-f{background:var(--accent-soft);color:var(--accent)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.inp{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.inp input,.inp input[type=text],.inp input[type=time]{border:0;border-radius:0;background:none;padding:8px 0;width:72px;font-variant-numeric:tabular-nums;text-align:right}
.inp input:focus-visible{outline:none}
.inp:focus-within{border-color:var(--accent)}
.inp span{color:var(--ink2);font-size:13px}
input[type=text],input[type=time],input[type=email],input[type=password],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}

/* week strip */
.stripbar{display:flex;align-items:stretch;gap:6px}
.strip{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:0}
.dchip{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}
.dchip .dl{font-size:11px;color:var(--ink2);font-weight:600}
.dchip .dn{font-family:var(--font-d);font-size:21px;font-weight:600;line-height:1}
.dchip .dk{width:6px;height:6px;border-radius:50%;background:var(--ink2);opacity:.45}
.dchip .dk.k-f{background:var(--accent);opacity:1}
.dchip i{position:absolute;left:0;bottom:0;height:4px;width:var(--h);background:var(--accent)}
.dchip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dchip.today .dn{color:var(--accent)}
.arrow{width:34px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:18px;color:var(--ink2)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dayhead h2{font-size:26px}
.dayhead p{color:var(--ink2);font-size:14px}

/* totals */
.big{font-family:var(--font-d);font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--ink2);font-weight:500}
.meter{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter.over i{background:var(--warn)}
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mac{display:flex;flex-direction:column;gap:5px}
.mac b{font-family:var(--font-d);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.mac b small{font-size:14px;color:var(--ink2);font-weight:500}
.mac .l{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.mac.p i{background:var(--p)} .mac.c i{background:var(--c)} .mac.g i{background:var(--g)}
.plan-line{font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}

/* schedule list */
.sched{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.srow{--tc:var(--t-prep);border-left:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface));border-radius:6px}
.srow.t-football{--tc:var(--t-football)} .srow.t-kids{--tc:var(--t-kids)} .srow.t-strength{--tc:var(--t-strength)}
.srow.t-meal{--tc:var(--t-meal)} .srow.t-rest{--tc:var(--t-rest)} .srow.t-work{--tc:var(--t-work)}
.srow.t-free{--tc:var(--t-free)} .srow.t-prep{--tc:var(--t-prep)} .srow.t-sleep{--tc:var(--t-sleep)} .srow.t-wake{--tc:var(--t-wake)}
.srow label,.srow .in{display:grid;grid-template-columns:auto 50px 1fr;align-items:center;gap:10px;padding:7px 10px;min-width:0}
.srow .in{grid-template-columns:50px 1fr auto}
.srow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.srow .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.srow .tx{min-width:0;overflow-wrap:anywhere}
.srow em{font-style:normal;color:var(--ink2);font-size:12px;margin-left:6px;white-space:nowrap}
.srow .ty{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.srow input:checked ~ .tx{text-decoration:line-through;opacity:.55}

/* week table */
.wt{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.wrow .d{font-family:var(--font-d);font-size:19px;font-weight:600}
.wrow .bar{display:flex;flex-direction:column;gap:3px;min-width:0}
.wrow .bar span{font-size:12px;color:var(--ink2)}
.wrow .kg{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2);min-width:56px;text-align:right}

/* meal slots */
.slot{display:flex;flex-direction:column;gap:10px}
.slot .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.slot .hd h3 span{font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--ink2);margin-left:6px}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ent .n{min-width:0}
.ent .n b{font-weight:500}
.ent .n small{display:block;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.ent .inp input[type=text]{width:56px}
.ent .x{background:none;border:0;color:var(--ink2);font-size:18px;padding:2px 6px}
.ghost{color:var(--ink2);font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.pick{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pick input{width:100%}
.picklist{max-height:236px;overflow:auto;display:flex;flex-direction:column}
.picklist button{display:flex;justify-content:space-between;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 4px;text-align:left}
.picklist button:hover{background:var(--surface2)}
.picklist .pr{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.picklist .pr button:first-child{flex:1;border-bottom:0;min-width:0}
.picklist .star{border:0;border-bottom:0;background:none;padding:0 12px;font-size:20px;line-height:1;color:var(--ink2);flex:none;justify-content:center;align-items:center}
.picklist .star.on{color:var(--accent)}
.picklist .alt-i{white-space:normal;display:block;margin-top:2px}
.picklist small{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* weight */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat .l{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-family:var(--font-d);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--ink2);font-weight:500}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:520px;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.tx2{fill:var(--ink2);font:11px var(--font-b)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;vertical-align:middle;margin-right:6px}
.legend .a::before{width:8px;height:8px;border-radius:50%;background:var(--ink2)}
.legend .b::before{width:16px;height:3px;background:var(--accent)}
.legend .c::before{width:16px;border-top:2px dashed var(--ink2)}
.rec{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rec.warn{border-left-color:var(--warn)}
@media print{.noprint,#toast{display:none!important}body{background:#fff;color:#000}.card,.rec{break-inside:avoid}}
ol.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cls{display:flex;flex-direction:column;gap:10px}
.cli{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;color:var(--ink)}
.cli:hover{border-color:var(--accent)}
.cl-h{display:flex;align-items:center;gap:10px}.cl-h b{flex:1;min-width:0;font-size:17px;overflow-wrap:anywhere}
.dot{width:12px;height:12px;border-radius:99px;flex:none;background:var(--line)}
.dot.lv-ok{background:var(--good)}.dot.lv-warn{background:var(--warn)}.dot.lv-bad{background:var(--bad)}
.cl-m{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink2);font-size:13px}
.cl-a{margin:0;padding-left:18px;color:var(--warn);font-size:13px}
.bigcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:.16em;margin:0;text-align:center;padding:10px;background:var(--accent-soft);color:var(--accent);border-radius:8px}
.selectable{user-select:all;overflow-wrap:anywhere}
.dslot{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.irow{display:flex;gap:10px;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.irow b{font-weight:600;flex:none;max-width:42%}
.irow span{text-align:right;min-width:0;overflow-wrap:anywhere}
.bdg{display:inline-block;min-width:20px;padding:1px 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:1.5}
.bdg[hidden]{display:none}
.chatlist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:84%;padding:8px 12px;border-radius:14px;background:var(--surface2);color:var(--ink);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg small{display:block;color:var(--ink2);font-size:11px;margin-top:2px}
.chatbox{display:flex;gap:8px;align-items:flex-end}
.chatbox textarea{flex:1;min-width:0}
.rcp p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 8px}
.pmrow{display:flex;align-items:center;gap:8px}
.pmn{flex:1;min-width:0;overflow-wrap:anywhere}
.pmrow .inp{width:104px;flex:none}
details.fold summary{cursor:pointer;display:flex;list-style:none;justify-content:space-between;align-items:center;gap:12px;font-family:var(--font-d);font-size:21px;line-height:1.15;font-weight:600;list-style-position:inside}
details.fold summary span{font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--ink2)}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:'';flex:none;width:8px;height:8px;margin-left:2px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.fold[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
details.fold summary span{margin-left:auto}
details.fold[open] summary{margin-bottom:12px}
details.week{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.week summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;font-family:var(--font-d);font-size:19px;font-weight:600;list-style-position:inside}
details.week summary span{font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--ink2)}
.wk{width:100%;border-collapse:collapse}
.wk th,.wk td{padding:6px 14px;text-align:left;border-top:1px solid var(--line);font-size:14px}
.wk th{font-weight:500;color:var(--ink2);font-size:13px}
.wk .inp input[type=text]{width:60px}

/* routine */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gin{min-width:780px;display:grid;grid-template-columns:42px repeat(7,1fr)}
.gh{padding:8px 6px;font-family:var(--font-d);font-size:16px;font-weight:600;text-align:center;border-bottom:1px solid var(--line);background:var(--surface)}
.gh small{display:block;font-family:var(--font-b);font-size:11px;font-weight:500;color:var(--ink2)}
.gt{position:relative;height:680px;border-right:1px solid var(--line)}
.gt span{position:absolute;right:5px;font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums;transform:translateY(-6px)}
.gc{position:relative;height:680px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.blk{--tc:var(--t-prep);position:absolute;left:2px;right:2px;border-left:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 22%,var(--surface));border-radius:4px;padding:1px 4px;font-size:10.5px;line-height:1.2;overflow:hidden}
.blk b{font-variant-numeric:tabular-nums}
.t-football.blk{--tc:var(--t-football)} .t-kids.blk{--tc:var(--t-kids)} .t-strength.blk{--tc:var(--t-strength)}
.t-meal.blk{--tc:var(--t-meal)} .t-rest.blk{--tc:var(--t-rest)} .t-work.blk{--tc:var(--t-work)}
.t-free.blk{--tc:var(--t-free)} .t-prep.blk{--tc:var(--t-prep)} .t-sleep.blk{--tc:var(--t-sleep)} .t-wake.blk{--tc:var(--t-wake)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--tc)}

/* plan */
.tgt{width:100%;border-collapse:collapse}
.tgt th,.tgt td{padding:6px 8px;text-align:left;border-top:1px solid var(--line);font-size:14px}
.tgt th{font-weight:500;color:var(--ink2)}
.tgt thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em}

var PALL=['pollo','pavo','merluza','salmon','atun','ternera','huevo','tofu','soja_tex','legumbres'];
function clampG(g,lo,hi,f){
  var u=f.id==='huevo'?50:5;
  g=Math.max(lo,Math.min(hi,g));g=Math.round(g/u)*u;
  if(lo>0&&g<u)g=u;
  return g;
}
function solveRecipe(rec,kT,pT,ok){
  var it=[];
  rec.forEach(function(s){
    var id=null,i;
    for(i=0;i<s.o.length;i++)if(ok(s.o[i])){id=s.o[i];break;}
    if(!id&&s.r==='P')for(i=0;i<PALL.length;i++)if(ok(PALL[i])){id=PALL[i];break;}
    var f=id&&findFood(id);if(!f)return;
    it.push({r:s.r,f:f,g:s.g||f.def});
  });
  var P=it.filter(function(x){return x.r==='P';})[0],C=it.filter(function(x){return x.r==='C';})[0];
  var fx=it.filter(function(x){return x.r==='X'||x.r==='F';}),fk=fx.reduce(function(a,x){return a+x.f.kcal*x.g/100;},0);
  if(fk>kT*0.55){var fac=Math.max(0.35,kT*0.55/fk);fx.forEach(function(x){x.g=Math.max(x.r==='F'?5:20,Math.round(x.g*fac/5)*5);});}
  fk=fx.reduce(function(a,x){return a+x.f.kcal*x.g/100;},0);
  function sum(skip,key){return it.reduce(function(a,x){return x===skip?a:a+x.f[key]*x.g/100;},0);}
  for(var n=0;n<5;n++){
    if(P){var hiP=Math.max(P.f.def*0.3,Math.min(P.f.def*2.2,(kT*(C?0.65:0.9)-fk)/(P.f.kcal/100)));P.g=clampG((pT-sum(P,'p'))/(P.f.p/100),P.f.def*0.3,hiP,P.f);}
    if(C)C.g=clampG((kT-sum(C,'kcal'))/(C.f.kcal/100),0,C.f.def*3.2,C.f);
  }
  return it.filter(function(x){return x.g>0;}).map(function(x){return [x.f.id,x.g];});
}
var menuMemo={};

  if(menuMemo[key])return menuMemo[key];
  var ok=allowedFn(a),sh=SHARE[a.meals],out={};
  G.slots.forEach(function(s){
    out[s.id]=RCP[s.id].map(function(rec){return solveRecipe(rec,t.kcal*sh[s.id],t.p*sh[s.id],ok);}).filter(function(x){return x.length;});
  });
  menuMemo[key]=out;return out;
}

 lunch:[

function shortN(id){var f=findFood(id);return f?f.name.replace(/\s*\(.*?\)/g,'').replace(/^Pechuga de /,'').replace(/^Otra pieza de fruta$/,'Fruta').replace(/\s*%/g,' %').replace(/\s+/g,' ').trim().replace(/^./,function(c){return c.toUpperCase();}):'';}
function dishName(items){
  var a=shortN(items[0][0]),b=items[1]?shortN(items[1][0]).toLowerCase():'';
  return a+(b?' con '+b:'');
}
function altDishes(slot,plan,cur){
  var ok=isSot()?function(){return true;}:allowedFn(G.a),tn=slotN(plan),out=[],seen={},curKey=(cur||[]).map(function(x){return x.f;}).sort().join(',');
  (RCP[slot]||[]).concat(ALT_X[slot]||[]).forEach(function(rec){
    if(!rec.every(function(x){return x.o.some(ok);}))return;
    var P=rec.filter(function(x){return x.r==='P';})[0],C=rec.filter(function(x){return x.r==='C';})[0];
    var ps=P?P.o.filter(ok).slice(0,4):[null],cs=C?C.o.filter(ok).slice(0,2):[null];
    ps.forEach(function(p){cs.forEach(function(c){
      var r2=rec.map(function(x){return x===P?{r:'P',o:[p]}:x===C?{r:'C',o:[c]}:x;});
      var it=solveRecipe(r2,tn.kcal,tn.p,ok);if(!it||!it.length)return;
      var list=it.map(function(x){return {f:x[0],g:x[1]};}),n=slotN(list),key=list.map(function(x){return x.f;}).sort().join(',');
      if(seen[key]||key===curKey)return;
      var dk=Math.abs(n.kcal-tn.kcal),dp=Math.abs(n.p-tn.p);
      if(dk>tn.kcal*0.12+30||dp>tn.p*0.25+3)return;
      seen[key]=1;out.push({name:dishName(it),items:list,n:n,sc:dk/Math.max(tn.kcal,1)+dp/Math.max(tn.p,1)});
    });});
  });
  out.sort(function(a,b){return a.sc-b.sc;});
  var names={},res=[];
  out.forEach(function(x){if(res.length>=8)return;var kk=x.name.toLowerCase();if(names[kk])return;names[kk]=1;res.push(x);});
  return res;
}

/* Horario: despertar, comidas repartidas, entreno, bloque de trabajo y sueño */
function r15(x){return Math.round(x/15)*15;}
function mealTimes(a,train){
  var wake=a.wake,bed=a.bed,ts=a.ttime,dur=a.dur||60,te=ts+dur;
  var bf=r15(wake+45),lu=r15(Math.max(840,wake+270)),di=r15(Math.min(1350,Math.max(lu+300,bed-150)));
  var T={breakfast:bf,lunch:lu,dinner:di,snack:r15((lu+di)/2),mid:r15((bf+lu)/2)};
  var res=G.slots.map(function(s){return {id:s.id,t:T[s.id],tag:''};});
  if(!train)return res;
  function inWin(t){return t>ts-45&&t<te+15;}
  res.forEach(function(m){
    if(!inWin(m.t))return;
    if(m.t<=ts+dur/3&&ts-75>=wake+10){m.t=ts-75;m.tag='pre';}else{m.t=te+30;m.tag='post';}
  });
  res.sort(function(x,y){return x.t-y.t;});
  for(var pass=0;pass<3;pass++)for(var i=1;i<res.length;i++){
    if(res[i].t-res[i-1].t<75)res[i].t=res[i-1].t+75;
    if(inWin(res[i].t)&&res[i].tag!=='pre'){res[i].t=te+30;res[i].tag='post';}
  }
  res.sort(function(x,y){return x.t-y.t;});
  return res;
}
function carve(s,e,busy){
  var b=busy.slice().sort(function(x,y){return x[0]-y[0];}),cur=s,out=[];
  b.forEach(function(x){if(x[1]<=cur||x[0]>=e)return;if(x[0]-cur>=45)out.push([cur,x[0]]);cur=Math.max(cur,x[1]);});
  if(e-cur>=45)out.push([cur,e]);
  return out;
}
function overlaps(s,e,busy){return busy.some(function(x){return s<x[1]&&e>x[0];});}
function schedGen(d){
  var a=G.a,w=wdOf(d),train=!!a.days[w],rows=[],ms=mealTimes(a,train),ts=a.ttime,dur=a.dur||60,te=ts+dur,busy=[],lastMeal=0;
  rows.push(R(a.wake,null,'Despertar, agua y peso en ayunas','wake'));
  ms.forEach(function(m){
    var len=(m.id==='lunch'||m.id==='dinner')?45:30;
    rows.push(R(m.t,m.t+len,SLOT_ALL[m.id]+(m.tag==='pre'?' (antes de entrenar)':m.tag==='post'?' (después de entrenar)':''),'meal',m.id));
    busy.push([m.t,m.t+len]);lastMeal=Math.max(lastMeal,m.t+len);
  });
  if(train){
    rows.push(R(ts-10,ts,'Calentamiento y movilidad','strength'),R(ts,te,sessName(),'strength'),R(te,te+30,'Ducha y recuperación','prep'));
    busy.push([ts-10,te+30]);
  }
  if(a.work&&a.wdays[w])carve(a.ws,a.we,busy).forEach(function(x){rows.push(R(x[0],x[1],'Trabajo o estudio','work'));busy.push(x);});
  if(!train){for(var t0=1050;t0<=a.bed-150;t0+=15)if(!overlaps(t0,t0+30,busy)){rows.push(R(t0,t0+30,'Paseo de 30 minutos','free'));busy.push([t0,t0+30]);break;}}
  if(lastMeal+20<a.bed-45)rows.push(R(lastMeal+15,lastMeal+35,'Preparar comidas y ropa de mañana','prep'));
  rows.push(R(a.bed-30,a.bed,'Sin pantallas y a dormir','sleep'));
  return rows.sort(function(x,y){return x.s-y.s;});
}

/* ---------- weight ---------- */
function weeksData(){
  var out=[];

    var days=[];
    for(var i=0;i<7;i++){var d=addDays(START,w*7+i);days.push({d:d,kg:S.weights[d]!=null?S.weights[d]:null,waist:S.waist[d]!=null?S.waist[d]:null});}
    var vals=days.filter(function(x){return x.kg!=null;}).map(function(x){return x.kg;});
    out.push({w:w,days:days,n:vals.length,mean:vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null});
  }
  return out;
}
function weekMean(d){
  var m=mondayOf(d),v=[];
  for(var i=0;i<7;i++){var x=S.weights[addDays(m,i)];if(x!=null)v.push(x);}
  return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null;
}
function recGen(w,dl,b){
  var p=G.pace,ab=f1(Math.abs(dl)),m='La media de la semana '+(w+1)+' ('+f1(b.mean)+' kg) ';
  if(G.goal==='bajar'){
    if(dl>p*0.67)return {w:w,dl:dl,kind:'cut',msg:m+(dl>0.05?'subió '+ab+' kg':'bajó solo '+ab+' kg')+' respecto a la anterior, menos de lo previsto. Resta 150 kcal a los objetivos (baja un poco los carbohidratos).'};
    if(dl<p*2)return {w:w,dl:dl,kind:'add',msg:m+'bajó '+ab+' kg, más rápido de lo previsto. Suma 200 kcal con carbohidratos para no perder músculo ni rendimiento.'};
    return {w:w,dl:dl,kind:'ok',msg:m+'bajó '+ab+' kg. El ritmo es el previsto: mantén las calorías.'};
  }
  if(G.goal==='subir'){
    if(dl<p*0.4)return {w:w,dl:dl,kind:'add',msg:m+(dl<-0.05?'bajó '+ab+' kg':'subió solo '+ab+' kg')+', menos de lo previsto. Suma 200 kcal a los objetivos (más carbohidratos).'};
    if(dl>p*2.2)return {w:w,dl:dl,kind:'cut',msg:m+'subió '+ab+' kg, más rápido de lo previsto: parte puede ser grasa. Resta 150 kcal a los objetivos.'};
    return {w:w,dl:dl,kind:'ok',msg:m+'subió '+ab+' kg. El ritmo es el previsto: mantén las calorías.'};
  }
  if(dl>0.4)return {w:w,dl:dl,kind:'cut',msg:m+'subió '+ab+' kg. Para mantener el peso, resta 150 kcal a los objetivos.'};
  if(dl<-0.4)return {w:w,dl:dl,kind:'add',msg:m+'bajó '+ab+' kg. Para mantener el peso, suma 200 kcal a los objetivos.'};
  return {w:w,dl:dl,kind:'ok',msg:m+'se mantiene estable ('+(dl>0?'+':dl<0?'−':'')+ab+' kg). Mantén las calorías.'};
}

function recFor(ws,w){
  var a=ws[w-1],b=ws[w];
  if(!(w>=1&&a&&b&&a.mean!=null&&b.mean!=null&&a.n>=3&&b.n>=3))return null;
  var dl=b.mean-a.mean;
  if(!isSot())return recGen(w,dl,b);
  if(dl>-0.2) return {w:w,dl:dl,kind:'cut',msg:'La media de la semana '+(w+1)+' ('+f1(b.mean)+' kg) bajó solo '+f1(Math.abs(dl))+' kg respecto a la anterior. Resta 150 kcal, del carbohidrato de la cena.'};
  if(dl<-0.6) return {w:w,dl:dl,kind:'add',msg:'La media de la semana '+(w+1)+' ('+f1(b.mean)+' kg) bajó '+f1(Math.abs(dl))+' kg, más rápido de lo previsto. Suma 200 kcal con pan o fruta en la merienda para no perder músculo.'};
  return {w:w,dl:dl,kind:'ok',msg:'La media de la semana '+(w+1)+' bajó '+f1(Math.abs(dl))+' kg. El ritmo es el previsto: mantén las calorías.'};
}

}

function miniLine(pts,unit,label){

  function x(d){return pts.length===1?W/2:pl+14+(W-pl-pr-28)*diffDays(d,t0)/span;}

  });
  return s+'</svg>';
}

function shrink(file){
  return new Promise(function(res,rej){
    function draw(src,w,h){
      var k=Math.min(1,1000/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      c.getContext('2d').drawImage(src,0,0,c.width,c.height);
      c.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',0.82);
    }
    if(window.createImageBitmap){
      createImageBitmap(file,{imageOrientation:'from-image'}).then(function(bm){draw(bm,bm.width,bm.height);},function(){viaImg();});
    } else viaImg();
    function viaImg(){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){draw(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(u);};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'));};im.src=u;}
  });
}

function genRules(){
  var a=G.a,p=G.pace,kg=S.settings.kg,lo=Math.round(kg*35/100)/10,hi=Math.round(kg*40/100)/10,sl=(a.wake+1440-a.bed)/60,L=[];
  if(G.goal==='bajar'){
    L.push('Si la media semanal baja menos de '+f2(Math.abs(p)*0.67)+' kg, resta 150 kcal (baja un poco los carbohidratos).');
    L.push('Si baja más de '+f2(Math.abs(p)*2)+' kg, suma 200 kcal con carbohidratos para no perder músculo.');
    L.push('Para y sube 200–300 kcal de carbohidratos si hay cansancio que no se va, bajada clara de rendimiento, mal sueño, mareos o una pérdida de más de 1 kg por semana.');
    L.push('Después de las 4 semanas, una semana a mantenimiento (≈'+f0(G.maint)+' kcal) antes de decidir si repites.');
  } else if(G.goal==='subir'){
    L.push('Si la media semanal sube menos de '+f2(p*0.4)+' kg, suma 200 kcal (más carbohidratos).');
    L.push('Si sube más de '+f2(p*2.2)+' kg, resta 150 kcal: parte de lo que ganas puede ser grasa.');
    L.push('Revisa la cintura cada semana: si crece más rápido que el peso, el superávit es demasiado alto.');
  } else {
    L.push('Si la media semanal sube o baja más de 0,4 kg, ajusta 150–200 kcal en sentido contrario.');
    L.push('Para mejorar la composición corporal, lo importante es la fuerza progresiva y la proteína alta, no el peso.');
  }
  return '<section class="card"><h2>Reglas de ajuste</h2><ul class="plain">'+L.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></section>'+
    '<section class="card"><h2>Hidratación, suplementos y sueño</h2><ul class="plain"><li>Agua: 35–40 ml por kg al día (≈'+f1(lo)+'–'+f1(hi)+' L), más 500 ml los días que entrenes.</li><li>Opcionales: proteína en polvo, creatina de 3 a 5 g al día y cafeína antes de entrenar, nunca por la tarde.</li><li>Sueño: de '+(a.bed===1440?'0:00':fmtT(a.bed))+' a '+fmtT(a.wake)+' ('+f1(sl)+' h), sin pantallas la última media hora.</li></ul></section>';
}

function obValidateBase(step){
  var a=obAns(),nT=a.days.filter(Boolean).length;
  if(step===0){
    if(!a.name)return 'Escribe tu nombre.';
    if(!a.sex)return 'Elige una opción de sexo: la fórmula del gasto energético la necesita.';
    if(a.age==null||a.age<14||a.age>90)return 'Escribe una edad válida.';
    if(a.age<18)return 'Esta app no genera planes de calorías para menores de 18 años. Habla con tu médico o pediatra.';
    if(a.h==null||a.h<130||a.h>220)return 'La altura debe estar entre 130 y 220 cm.';
    if(a.kg==null||a.kg<35||a.kg>250)return 'El peso debe estar entre 35 y 250 kg.';
  }
  if(step===1){
    if(!a.goal)return 'Elige un objetivo.';
    if(a.goal==='bajar'&&a.kg/Math.pow(a.h/100,2)<18.5)return 'Con tu peso y altura (IMC por debajo de 18,5) no recomiendo perder peso. Elige mantener o ganar músculo.';
  }
  if(step===2&&nT>0){
    if(!a.ttype||!a.int)return 'Completa el tipo e intensidad del entreno.';
  }
  if(step===3){
    var sl=(a.wake+1440-a.bed)/60;
    if(sl<4||sl>12)return 'Revisa las horas de despertar y de dormir.';
    if(a.work&&a.we<=a.ws)return 'La hora de fin de trabajo o estudio debe ser posterior a la de inicio.';
  }
  if(step===5){
    if(ob.emb||ob.tca)return 'No puedo generar un plan de calorías con embarazo, lactancia o antecedentes de trastorno de la conducta alimentaria. Habla con tu médico o dietista.';
    if(!ob.ok)return 'Marca la casilla para continuar.';
  }
  return '';
}

function menuCoverage(a,pl){
  var oS=S,oG=G,oP=PROF,res=1;
  try{
    PROF={id:'tmp',type:'gen'};S=newGenState(a,pl,mondayOf(todayS()));G=makeG(S.profile);
    var tot=0,n=0;
    ['f','r'].forEach(function(k){
      var m=genMenu(k);
      for(var vi=0;vi<3;vi++){var p=0;G.slots.forEach(function(sl){var arr=m[sl.id];p+=slotN(arr[vi%arr.length].map(function(x){return {f:x[0],g:x[1]};})).p;});tot+=p/pl.t[k].p;n++;}
    });
    res=tot/n;
  }catch(e){}
  S=oS;G=oG;PROF=oP;menuMemo={};
  return res;
}

/* ejecuta fn con los datos de un cliente cargados como si fueran los propios (solo lectura) */
function withClient(c,fn){
  var sv={S:S,PROF:PROF,G:G,START:START,MAINT:MAINT,SLOTS:SLOTS,TYPES:TYPES,TPL:TPL,KEY:KEY,memo:menuMemo};
  try{
    PROF={id:c.profile_id,name:c.name,type:c.type,key:'plan-p-'+c.profile_id};
    S=mergeState(c.data);
    if(!isSot()&&!(S.profile&&S.profile.ans&&S.profile.plan))throw new Error('perfil incompleto');
    if(c.plan&&(c.plan.targets||c.plan.menu)){
      var cc=Object.assign({},S.coach||{});
      if(c.plan.targets&&c.plan.targets.f){cc.t=clone(c.plan.targets);S.settings.t=clone(c.plan.targets);}
      if(c.plan.menu)cc.menu=clone(c.plan.menu);
      S.coach=cc;
    }
    var keep=ui.pwk;setupPlan();
    if(ui.pcur===c.link)ui.pwk=keep;else ui.pcur=c.link;
    return fn();
  } finally {
    S=sv.S;PROF=sv.PROF;G=sv.G;START=sv.START;MAINT=sv.MAINT;SLOTS=sv.SLOTS;TYPES=sv.TYPES;TPL=sv.TPL;KEY=sv.KEY;menuMemo=sv.memo;
  }
}
function proStats(c){
  try{return withClient(c,function(){
    var t=todayS(),i,d,n=0,sk=0,sp=0,st=0,last=null,days=Object.keys(S.logs).sort(),al=[];
    for(i=days.length-1;i>=0;i--){if(dayN(days[i]).kcal>0){last=days[i];break;}}
    for(i=0;i<7;i++){d=addDays(t,-i);var x=dayN(d);if(x.kcal>0){n++;sk+=x.kcal;sp+=x.p;st+=S.settings.t[dayKind(d)].kcal;}}
    var started=diffDays(t,START)>=0,ws=weeksData(),rec=recommendation(ws),lw=null,lwd=null;
    Object.keys(S.weights).sort().forEach(function(k){lw=S.weights[k];lwd=k;});
    var since=last?diffDays(t,last):null;
    if(started){
      if(last==null&&diffDays(t,START)>=2)al.push('Todavía no ha registrado ninguna comida');
      else if(since!=null&&since>=3)al.push('Sin registrar comidas desde hace '+since+' días');
    }
    if(fatigueAlert())al.push('Tres registros seguidos con poca energía o mucho cansancio');
    if(rec&&rec.kind!=='ok'&&!proProf())al.push('El peso no va al ritmo previsto');
    if(!tgtOn())al.push('Pendiente: fijar sus objetivos'+(coachMenu()?'':' y preparar su menú'));
    var okK=0;for(i=0;i<7;i++){d=addDays(t,-i);var y=dayN(d),tk=S.settings.t[dayKind(d)].kcal;if(y.kcal>=tk*0.9&&y.kcal<=tk*1.05)okK++;}
    if(tgtOn()&&n>=4&&okK<n*0.5)al.push('Pocos días dentro de las calorías objetivo');
    var lvl=(started&&(last==null&&diffDays(t,START)>=2||since>=3||al.length>=2))?'bad':(al.length?'warn':'ok');
    return {goal:isSot()?'Definición':GOALS[G.goal],kg:S.settings.kg,lw:lw,lwd:lwd,last:last,since:since,n:n,avgK:n?sk/n:null,avgT:n&&tgtOn()?st/n:null,wait:!tgtOn(),avgP:n?sp/n:null,alerts:al,level:lvl,started:started,start:START};
  });}catch(e){return null;}
}

}

  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o!=='object'||!o.weights)throw 0;if(isSot()===!!o.profile)throw 0;if(!isSot()&&!(o.profile.ans&&o.profile.plan&&o.profile.start))throw 0;S=mergeState(o);if(!isSot()){PROF.name=S.profile.ans.name||PROF.name;saveIndex();}setupPlan();save();render();toast('Copia restaurada');}catch(err){toast('El archivo no es una copia válida');}};
  r.readAsText(file);
});
app.addEventListener('submit',function(e){
  var f=e.target;if(!f||!f.dataset||!f.dataset.form)return;
  e.preventDefault();if(ui.busy)return;
  if(f.dataset.form==='auth')authSubmit();else if(f.dataset.form==='newpw')newPwSubmit();
});
function parseRecovery(){
  try{
    var h=location.hash.replace(/^#/,'');if(!h)return null;
    var q={};h.split('&').forEach(function(x){var i=x.indexOf('=');if(i>0)q[decodeURIComponent(x.slice(0,i))]=decodeURIComponent(x.slice(i+1).replace(/\+/g,' '));});
    if(q.access_token&&q.type==='recovery'){history.replaceState(null,'',location.pathname+location.search);return {access:q.access_token,refresh:q.refresh_token||'',expires:+q.expires_in||3600};}
    if(q.error_description){history.replaceState(null,'',location.pathname+location.search);ui.authMsg={k:'err',t:'El enlace ha caducado o no es válido. Pide uno nuevo desde "He olvidado la contraseña".'};}
  }catch(e){}
  return null;
}
function boot(){
  if(cloudOn()){
    var rec=parseRecovery();AUTH=authLoad();
    if(rec){ui.rec=rec;ui.screen='newpw';render();return;}
    if(!AUTH){try{var iq0=new URLSearchParams(location.search).get('pro');if(iq0){localStorage.setItem('plan-invite',iq0.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12));history.replaceState(null,'',location.pathname+location.hash);}ui.invite=localStorage.getItem('plan-invite')||'';}catch(x){}ui.au.kind='client';ui.screen='auth';render();return;}
    try{var iq=new URLSearchParams(location.search).get('pro');if(iq){localStorage.setItem('plan-invite',iq.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12));history.replaceState(null,'',location.pathname+location.hash);}ui.invite=localStorage.getItem('plan-invite')||'';}catch(x){}
    if(AUTH.pro){ui.screen='pro';ui.ptab='clientes';render();proInit().then(function(){if(PRO){render();proLoad();}else{INDEX=loadIndex();openActive();cloudRefresh().then(syncPush);}});return;}
    INDEX=loadIndex();openActive();
    cloudRefresh().then(function(ch){
      if(ui.screen==='onb'||ui.screen==='auth')return;
      if(INDEX&&(!INDEX.active||!PROF)&&!ui.screen){openActive();return;}
      if(ch)render();
    }).then(syncPush);
    return;
  }
  INDEX=loadIndex();
  if(!(INDEX.active&&activate(INDEX.active))){INDEX.active=null;PROF=null;ui.screen=INDEX.list.length?'profiles':'welcome';}
  render();
}
boot();
document.addEventListener('visibilitychange',function(){
  if(!cloudOn()||!AUTH)return;
  if(AUTH.pro){if(!document.hidden&&PRO&&Date.now()-PC.at>30000&&ui.screen==='pro'&&!ui.psel)proLoad();return;}
  if(!INDEX)return;
  if(document.hidden){syncPush();return;}
  if(Date.now()-pullAt>30000)cloudRefresh().then(function(ch){if(ch&&!ui.screen)render();});
});
window.addEventListener('online',function(){if(cloudOn()&&AUTH&&INDEX){syncPush();cloudRefresh().then(function(ch){if(ch&&!ui.screen)render();});}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}catch(e){}
})();
</script>
