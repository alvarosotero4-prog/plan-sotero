<!doctype html>
<html lang="es">
<head>

<title>Plan Sotero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one column under a sticky tab bar. Cards hold totals and forms; a timeline grid shows the week. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface2:#E6ECE5; --ink:#14211A; --ink2:#52645A; --line:#D2DBD1;
  --accent:#1D6A45; --accent-ink:#FFFFFF; --accent-soft:#D4EADA;
  --p:#2C6DCE; --c:#C77F12; --g:#BF3F66;
  --good:#1B7F4B; --warn:#A8660A; --bad:#BA3434;
  --t-football:#1D6A45; --t-kids:#2C6DCE; --t-strength:#7048BD; --t-meal:#C77F12; --t-rest:#718078;
  --t-work:#456A8C; --t-free:#2F9393; --t-prep:#8C9A92; --t-sleep:#33405E; --t-wake:#8C9A92;
  --font-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-b:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1511; --surface:#16211A; --surface2:#1F2D24; --ink:#E6EEE8; --ink2:#9DB0A3; --line:#2B3B31;
    --accent:#57C089; --accent-ink:#08170F; --accent-soft:#1B3A29;
    --p:#6EA4F4; --c:#E9AB4C; --g:#F07C9C;
    --good:#5CC58C; --warn:#E3A24A; --bad:#EE7B7B;
    --t-football:#4DB27F; --t-kids:#6EA4F4; --t-strength:#A98BEA; --t-meal:#E0A04A; --t-rest:#8EA096;
    --t-work:#79A0C6; --t-free:#59BDBD; --t-prep:#7E8F85; --t-sleep:#7F90BF; --t-wake:#7E8F85;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16211A; --surface2:#1F2D24; --ink:#E6EEE8; --ink2:#9DB0A3; --line:#2B3B31;
  --accent:#57C089; --accent-ink:#08170F; --accent-soft:#1B3A29;
  --p:#6EA4F4; --c:#E9AB4C; --g:#F07C9C;
  --good:#5CC58C; --warn:#E3A24A; --bad:#EE7B7B;
  --t-football:#4DB27F; --t-kids:#6EA4F4; --t-strength:#A98BEA; --t-meal:#E0A04A; --t-rest:#8EA096;
  --t-work:#79A0C6; --t-free:#59BDBD; --t-prep:#7E8F85; --t-sleep:#7F90BF; --t-wake:#7E8F85;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-b);padding-inline:16px;padding-block:0 72px;-webkit-text-size-adjust:100%}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:21px;line-height:1.15}
h3{font-size:17px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink2);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header + tabs */
.top{padding-top:18px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:30px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.mark{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sub{color:var(--ink2);font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 2px 9px;font-family:var(--font-d);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* cards + generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.k-f{background:var(--accent-soft);color:var(--accent)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.inp{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.inp input,.inp input[type=text],.inp input[type=time]{border:0;border-radius:0;background:none;padding:8px 0;width:72px;font-variant-numeric:tabular-nums;text-align:right}
.inp input:focus-visible{outline:none}
.inp:focus-within{border-color:var(--accent)}
.inp span{color:var(--ink2);font-size:13px}
input[type=text],input[type=time],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}

/* week strip */
.stripbar{display:flex;align-items:stretch;gap:6px}
.strip{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:0}
.dchip{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}
.dchip .dl{font-size:11px;color:var(--ink2);font-weight:600}
.dchip .dn{font-family:var(--font-d);font-size:21px;font-weight:600;line-height:1}
.dchip .dk{width:6px;height:6px;border-radius:50%;background:var(--ink2);opacity:.45}
.dchip .dk.k-f{background:var(--accent);opacity:1}
.dchip i{position:absolute;left:0;bottom:0;height:4px;width:var(--h);background:var(--accent)}
.dchip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dchip.today .dn{color:var(--accent)}
.arrow{width:34px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:18px;color:var(--ink2)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dayhead h2{font-size:26px}
.dayhead p{color:var(--ink2);font-size:14px}

/* totals */
.big{font-family:var(--font-d);font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--ink2);font-weight:500}
.meter{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter.over i{background:var(--warn)}
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mac{display:flex;flex-direction:column;gap:5px}
.mac b{font-family:var(--font-d);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.mac b small{font-size:14px;color:var(--ink2);font-weight:500}
.mac .l{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.mac.p i{background:var(--p)} .mac.c i{background:var(--c)} .mac.g i{background:var(--g)}
.plan-line{font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}

/* schedule list */
.sched{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.srow{--tc:var(--t-prep);border-left:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface));border-radius:6px}
.srow.t-football{--tc:var(--t-football)} .srow.t-kids{--tc:var(--t-kids)} .srow.t-strength{--tc:var(--t-strength)}
.srow.t-meal{--tc:var(--t-meal)} .srow.t-rest{--tc:var(--t-rest)} .srow.t-work{--tc:var(--t-work)}
.srow.t-free{--tc:var(--t-free)} .srow.t-prep{--tc:var(--t-prep)} .srow.t-sleep{--tc:var(--t-sleep)} .srow.t-wake{--tc:var(--t-wake)}
.srow label,.srow .in{display:grid;grid-template-columns:auto 50px 1fr;align-items:center;gap:10px;padding:7px 10px;min-width:0}
.srow .in{grid-template-columns:50px 1fr auto}
.srow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.srow .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.srow .tx{min-width:0;overflow-wrap:anywhere}
.srow em{font-style:normal;color:var(--ink2);font-size:12px;margin-left:6px;white-space:nowrap}
.srow .ty{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.srow input:checked ~ .tx{text-decoration:line-through;opacity:.55}

/* week table */
.wt{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.wrow .d{font-family:var(--font-d);font-size:19px;font-weight:600}
.wrow .bar{display:flex;flex-direction:column;gap:3px;min-width:0}
.wrow .bar span{font-size:12px;color:var(--ink2)}
.wrow .kg{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2);min-width:56px;text-align:right}

/* meal slots */
.slot{display:flex;flex-direction:column;gap:10px}
.slot .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.slot .hd h3 span{font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--ink2);margin-left:6px}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ent .n{min-width:0}
.ent .n b{font-weight:500}
.ent .n small{display:block;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.ent .inp input[type=text]{width:56px}
.ent .x{background:none;border:0;color:var(--ink2);font-size:18px;padding:2px 6px}
.ghost{color:var(--ink2);font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.pick{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pick input{width:100%}
.picklist{max-height:236px;overflow:auto;display:flex;flex-direction:column}
.picklist button{display:flex;justify-content:space-between;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 4px;text-align:left}
.picklist button:hover{background:var(--surface2)}
.picklist small{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* weight */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat .l{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-family:var(--font-d);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--ink2);font-weight:500}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:520px;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.tx2{fill:var(--ink2);font:11px var(--font-b)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;vertical-align:middle;margin-right:6px}
.legend .a::before{width:8px;height:8px;border-radius:50%;background:var(--ink2)}
.legend .b::before{width:16px;height:3px;background:var(--accent)}
.legend .c::before{width:16px;border-top:2px dashed var(--ink2)}
.rec{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rec.warn{border-left-color:var(--warn)}
details.week{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.week summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;font-family:var(--font-d);font-size:19px;font-weight:600;list-style-position:inside}
details.week summary span{font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--ink2)}
.wk{width:100%;border-collapse:collapse}
.wk th,.wk td{padding:6px 14px;text-align:left;border-top:1px solid var(--line);font-size:14px}
.wk th{font-weight:500;color:var(--ink2);font-size:13px}
.wk .inp input[type=text]{width:60px}

/* routine */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gin{min-width:780px;display:grid;grid-template-columns:42px repeat(7,1fr)}
.gh{padding:8px 6px;font-family:var(--font-d);font-size:16px;font-weight:600;text-align:center;border-bottom:1px solid var(--line);background:var(--surface)}
.gh small{display:block;font-family:var(--font-b);font-size:11px;font-weight:500;color:var(--ink2)}
.gt{position:relative;height:680px;border-right:1px solid var(--line)}
.gt span{position:absolute;right:5px;font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums;transform:translateY(-6px)}
.gc{position:relative;height:680px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.blk{--tc:var(--t-prep);position:absolute;left:2px;right:2px;border-left:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 22%,var(--surface));border-radius:4px;padding:1px 4px;font-size:10.5px;line-height:1.2;overflow:hidden}
.blk b{font-variant-numeric:tabular-nums}
.t-football.blk{--tc:var(--t-football)} .t-kids.blk{--tc:var(--t-kids)} .t-strength.blk{--tc:var(--t-strength)}
.t-meal.blk{--tc:var(--t-meal)} .t-rest.blk{--tc:var(--t-rest)} .t-work.blk{--tc:var(--t-work)}
.t-free.blk{--tc:var(--t-free)} .t-prep.blk{--tc:var(--t-prep)} .t-sleep.blk{--tc:var(--t-sleep)} .t-wake.blk{--tc:var(--t-wake)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--tc)}

/* plan */
.tgt{width:100%;border-collapse:collapse}
.tgt th,.tgt td{padding:6px 8px;text-align:left;border-top:1px solid var(--line);font-size:14px}
.tgt th{font-weight:500;color:var(--ink2)}
.tgt thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tgt .inp input[type=text]{width:58px}
.scroll{overflow-x:auto}
.mrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding-top:10px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:0}
.mh{display:flex;flex-direction:column;min-width:0}
.mc{display:flex;align-items:center;gap:12px}
.chk{display:flex;align-items:center;gap:6px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.inp input[type=time]{width:118px;text-align:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.form input{width:100%}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
@media (max-width:520px){
  .big{font-size:40px}
  .dayhead h2{font-size:23px}
  .tabs button{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){ .meter i{transition:width .25s ease} }
</style>
</head>

/* ---------- utilities ---------- */
function pad(n){return String(n).padStart(2,'0');}
function f0(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function f1(n){return (Math.round(n*10)/10).toFixed(1).replace('.',',');}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function parseD(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12);}
function fmtD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d);}
function wdOf(s){return (parseD(s).getDay()+6)%7;}
function mondayOf(s){return addDays(s,-wdOf(s));}
function diffDays(a,b){return Math.round((parseD(a)-parseD(b))/864e5);}
var DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

function rangeLabel(a,b){var da=parseD(a),db=parseD(b);return da.getMonth()===db.getMonth()?da.getDate()+'–'+db.getDate()+' '+MON[da.getMonth()]:da.getDate()+' '+MON[da.getMonth()]+' – '+db.getDate()+' '+MON[db.getMonth()];}

function fmtT(m){return Math.floor(m/60)+':'+pad(m%60);}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}

/* ---------- food data (per 100 g, or per 100 ml for milk) ---------- */

var dbDoc=null,writing=false,dirty=false,timer=null;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(dbDoc){dirty=true;clearTimeout(timer);timer=setTimeout(flush,600);}
}
function flush(){
  if(writing||!dbDoc||!dirty) return;
  writing=true;dirty=false;
  dbDoc.set(JSON.parse(JSON.stringify(S))).then(function(){ui.sync='db';},function(){ui.sync='error';}).then(function(){
    writing=false;paintSync();if(dirty)flush();
  });
}
function paintSync(){var el=document.getElementById('sync');if(el)el.textContent=syncText();}
function syncText(){return 'Los datos se guardan solo en este dispositivo';}
function initCloud(){
  if(!window.claude||!window.claude.use) return;
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
    var user=r[0],db=r[1];
    if(!user||!db) return;
    return user.id().then(function(id){
      if(!id) return;
      var ref=db.doc('data/users/'+id+'/state');
      return ref.get().then(function(snap){
        if(snap.exists){S=mergeState(snap.data());try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}return null;}
        return ref.set(JSON.parse(JSON.stringify(S)));
      }).then(function(){
        dbDoc=ref;ui.sync='db';render();
        ref.onSnapshot(function(sn){
          if(!sn.exists||sn.metadata.hasPendingWrites||writing||dirty) return;
          var d=mergeState(sn.data());
          if(JSON.stringify(d)===JSON.stringify(S)) return;
          S=d;render();
        },function(){});
      });
    });
  }).catch(function(){});
}

var Z={kcal:0,p:0,c:0,g:0};
function addN(a,b){return {kcal:a.kcal+b.kcal,p:a.p+b.p,c:a.c+b.c,g:a.g+b.g};}
function foods(){return BASE.concat(S.foods.map(function(x){return {id:x.id,name:x.name,kcal:x.kcal,p:x.p,c:x.c,g:x.g,def:x.def||100,piece:x.piece||0,custom:true};}));}
function findFood(id){var l=foods();for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
function nut(e){var f=findFood(e.f);if(!f)return Z;var k=(e.g||0)/100;return {kcal:f.kcal*k,p:f.p*k,c:f.c*k,g:f.g*k};}
function slotN(list){return (list||[]).reduce(function(a,e){return addN(a,nut(e));},Z);}
function dayN(d){var L=S.logs[d]||{};return SLOTS.reduce(function(a,s){return addN(a,slotN(L[s.id]));},Z);}
function matchT(sun){return S.match[sun]||S.settings.match;}
function playsOn(sun){return !!S.plays[sun];}
function sunOf(d){var w=wdOf(d);return w===6?d:(w===0?addDays(d,-1):null);}
function sunMorning(d){return M(matchT(d))<840;}
function slotsFor(d){if(wdOf(d)===6&&!sunMorning(d))return SLOTS.filter(function(s){return s.id!=='snack';});return SLOTS;}
function planSlot(k,slot,d){
  if(d&&wdOf(d)===6){var free=sunMorning(d)?'lunch':'dinner';if(slot===free)return [{f:'libre',g:100}];}
  return MENU[k][slot].map(function(x){return {f:x[0],g:x[1]};});
}
function menuN(k,d){return slotsFor(d||'2026-10-12').reduce(function(a,s){return addN(a,slotN(planSlot(k,s.id,d)));},Z);}

function dayKind(d){var w=wdOf(d);if(w===1||w===4)return 'r';if(w===0)return playsOn(addDays(d,-1))?'r':'f';return 'f';}

/* ---------- weight ---------- */
function weeksData(){
  var out=[];
  for(var w=0;w<4;w++){
    var days=[];
    for(var i=0;i<7;i++){var d=addDays(START,w*7+i);days.push({d:d,kg:S.weights[d]!=null?S.weights[d]:null,waist:S.waist[d]!=null?S.waist[d]:null});}
    var vals=days.filter(function(x){return x.kg!=null;}).map(function(x){return x.kg;});
    out.push({w:w,days:days,n:vals.length,mean:vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null});
  }
  return out;
}
function weekMean(d){
  var m=mondayOf(d),v=[];
  for(var i=0;i<7;i++){var x=S.weights[addDays(m,i)];if(x!=null)v.push(x);}
  return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null;
}
function recommendation(ws){
  for(var w=3;w>=1;w--){
    var a=ws[w-1],b=ws[w];
    if(a.mean!=null&&b.mean!=null&&a.n>=3&&b.n>=3){
      var dl=b.mean-a.mean;
      if(dl>-0.2) return {w:w,dl:dl,kind:'cut',msg:'La media de la semana '+(w+1)+' ('+f1(b.mean)+' kg) bajó solo '+f1(Math.abs(dl))+' kg respecto a la anterior. Resta 150 kcal, del carbohidrato de la cena.'};
      if(dl<-0.6) return {w:w,dl:dl,kind:'add',msg:'La media de la semana '+(w+1)+' ('+f1(b.mean)+' kg) bajó '+f1(Math.abs(dl))+' kg, más rápido de lo previsto. Suma 200 kcal con pan o fruta en la merienda para no perder músculo.'};
      return {w:w,dl:dl,kind:'ok',msg:'La media de la semana '+(w+1)+' bajó '+f1(Math.abs(dl))+' kg. El ritmo es el previsto: mantén las calorías.'};
    }
  }
  return null;
}

function chartSVG(ws){
  var W=720,H=260,pl=42,pr=14,pt=14,pb=30,kg=S.settings.kg,pts=[];
  for(var i=0;i<28;i++){var d=addDays(START,i);if(S.weights[d]!=null)pts.push({i:i,kg:S.weights[d]});}
  var goal=kg-1.2,all=pts.map(function(p){return p.kg;}).concat([kg,goal]);
  var lo=Math.floor(Math.min.apply(null,all)-0.4),hi=Math.ceil(Math.max.apply(null,all)+0.4);
  function x(i){return pl+(W-pl-pr)*i/28;}
  function y(v){return pt+(H-pt-pb)*(hi-v)/(hi-lo);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Peso diario, media semanal y ritmo objetivo">';
  for(var v=lo;v<=hi;v++) s+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tx2" x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  for(var w=0;w<4;w++){
    s+='<line class="gl" x1="'+x(w*7)+'" x2="'+x(w*7)+'" y1="'+pt+'" y2="'+(H-pb)+'"/><text class="tx2" x="'+x(w*7+3.5)+'" y="'+(H-10)+'" text-anchor="middle">Semana '+(w+1)+'</text>';
  }

  ws.forEach(function(w){if(w.mean!=null)s+='<line x1="'+x(w.w*7+0.3)+'" x2="'+x(w.w*7+6.7)+'" y1="'+y(w.mean)+'" y2="'+y(w.mean)+'" style="stroke:var(--accent);stroke-width:4;stroke-linecap:round"/>';});

  return s+'</svg>';

    '<section class="card"><h2>Mis alimentos</h2><div class="form"><label>Nombre<input type="text" id="cf-n" placeholder="Ej. Pan de centeno"></label><label>kcal / 100 g<input type="text" inputmode="decimal" id="cf-k"></label><label>Proteína<input type="text" inputmode="decimal" id="cf-p"></label><label>Carbohidratos<input type="text" inputmode="decimal" id="cf-c"></label><label>Grasas<input type="text" inputmode="decimal" id="cf-g"></label><button class="btn main" data-act="addfood">Guardar alimento</button></div><p class="muted">Todos los valores son por cada 100 g.</p>'+
    (S.foods.length?'<ul class="plain">'+S.foods.map(function(f,i){return '<li>'+esc(f.name)+' · '+f0(f.kcal)+' kcal · P '+f1(f.p)+' · C '+f1(f.c)+' · G '+f1(f.g)+' <button class="btn sm" data-act="delfood" data-i="'+i+'">Quitar</button></li>';}).join('')+'</ul>':'')+'</section>'+
    '<section class="card"><h2>Tus datos</h2><p id="sync" class="muted">'+syncText()+'. Descarga una copia de vez en cuando por si borras los datos del navegador o cambias de móvil.</p><div class="btns"><button class="btn sm" data-act="export">Descargar copia</button><button class="btn sm" data-act="import">Restaurar copia</button><input type="file" id="imp" accept="application/json,.json" hidden><button class="btn danger sm" data-act="reset">'+(ui.confirm?'Confirmar: borrar todos los datos':'Borrar todos los datos')+'</button>'+(ui.confirm?'<button class="btn sm" data-act="resetno">Cancelar</button>':'')+'</div></section>';
  return h;
}
function render(){
  var y=window.scrollY,v=ui.tab==='hoy'?vHoy():ui.tab==='comidas'?vComidas():ui.tab==='peso'?vPeso():ui.tab==='rutina'?vRutina():vPlan();
  app.innerHTML=header()+tabs()+v;
  window.scrollTo(0,y);
}
function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.hidden=true;},2200);}
function logArr(d,s){var L=S.logs[d]||(S.logs[d]={});return L[s]||(L[s]=[]);}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,d=b.dataset.d,s=b.dataset.s,i=+b.dataset.i;
  if(a==='tab'){ui.tab=b.dataset.t;ui.picker=null;ui.q='';render();return;}
  if(a==='date'){ui.date=d;ui.rwd=wdOf(d);render();return;}
  if(a==='wk'){ui.date=addDays(ui.date,+b.dataset.n);render();return;}
  if(a==='check'){var c=S.checks[d]||(S.checks[d]={});if(b.checked)c[i]=true;else delete c[i];save();render();return;}
  if(a==='openpick'){ui.picker=ui.picker===s?null:s;ui.q='';ui.off={status:'idle',list:[],q:''};render();var q=document.getElementById('q');if(q)q.focus();return;}
  if(a==='pick'){var f=findFood(b.dataset.f);if(f){logArr(d,s).push({f:f.id,g:f.def});save();ui.picker=null;ui.q='';render();toast(f.name+' añadido');}return;}
  if(a==='offsearch'){offSearch(d,s);return;}
  if(a==='offpick'){var x=ui.off.list[i];if(!x)return;var fid='off'+x.code;
    if(!S.foods.some(function(f){return f.id===fid;}))S.foods.push({id:fid,name:x.name,kcal:x.kcal,p:x.p,c:x.c,g:x.g,def:100});
    logArr(d,s).push({f:fid,g:100});save();ui.picker=null;ui.q='';ui.off={status:'idle',list:[],q:''};render();toast(x.name+' añadido (100 g)');return;}
  if(a==='rm'){var arr=logArr(d,s);arr.splice(i,1);if(!arr.length)delete S.logs[d][s];save();render();return;}
  if(a==='useplan'){logArr(d,s);S.logs[d][s]=planSlot(dayKind(d),s,d);save();render();return;}
  if(a==='useplanall'){var k=dayKind(d);S.logs[d]=S.logs[d]||{};slotsFor(d).forEach(function(x){if(!(S.logs[d][x.id]&&S.logs[d][x.id].length))S.logs[d][x.id]=planSlot(k,x.id,d);});save();render();toast('Menú cargado');return;}
  if(a==='tortitas'){var k2=dayKind(d);logArr(d,s);S.logs[d][s]=[{f:'tortitas',g:235},k2==='f'?{f:'manzana',g:150}:{f:'platano',g:100}];save();render();return;}
  if(a==='clearslot'){if(S.logs[d])delete S.logs[d][s];save();render();return;}
  if(a==='clearday'){delete S.logs[d];save();render();return;}
  if(a==='rwd'){ui.rwd=+b.dataset.w;render();return;}
  if(a==='adj'){var n=+b.dataset.n,dk=n<0?-150:200;['f','r'].forEach(function(k3){var t=S.settings.t[k3];t.kcal+=dk;t.c=Math.max(0,Math.round(t.c+dk/4));});save();render();toast('Objetivos actualizados');return;}
  if(a==='addfood'){
    var nm=document.getElementById('cf-n').value.trim(),kc=num(document.getElementById('cf-k').value),p=num(document.getElementById('cf-p').value),c=num(document.getElementById('cf-c').value),g=num(document.getElementById('cf-g').value);
    if(!nm||kc==null){toast('Escribe el nombre y las kcal por 100 g');return;}
    S.foods.push({id:'x'+Date.now().toString(36),name:nm,kcal:kc,p:p||0,c:c||0,g:g||0,def:100});save();render();toast('Alimento guardado');return;}
  if(a==='delfood'){S.foods.splice(i,1);save();render();return;}
  if(a==='reset'){if(!ui.confirm){ui.confirm=true;render();return;}S=DEF();ui.confirm=false;save();render();toast('Datos borrados');return;}
  if(a==='resetno'){ui.confirm=false;render();return;}
});
app.addEventListener('change',function(e){
  var t=e.target,bd=t.dataset.bind;if(!bd)return;
  if(bd==='w'||bd==='waist'){var v=num(t.value),map=bd==='w'?S.weights:S.waist;if(t.value.trim()===''||v==null||v<=0){delete map[t.dataset.d];}else map[t.dataset.d]=Math.round(v*10)/10;save();render();return;}
  if(bd==='g'){var v2=num(t.value),arr=logArr(t.dataset.d,t.dataset.s),ix=+t.dataset.i;if(arr[ix]&&v2!=null&&v2>=0)arr[ix].g=Math.round(v2);save();render();return;}
  if(bd==='tg'){var v3=num(t.value);if(v3!=null&&v3>=0)S.settings.t[t.dataset.k][t.dataset.m]=Math.round(v3);save();render();return;}
  if(bd==='kg'){var v4=num(t.value);if(v4!=null&&v4>30&&v4<250)S.settings.kg=v4;save();render();return;}
  if(bd==='plays'){if(t.checked)S.plays[t.dataset.d]=true;else delete S.plays[t.dataset.d];save();render();return;}
  if(bd==='match'){if(t.value)S.match[t.dataset.d]=t.value;save();render();return;}
});
app.addEventListener('input',function(e){
  if(e.target.id==='q'){ui.q=e.target.value;var l=document.getElementById('picklist');if(l)l.innerHTML=pickList(ui.date,ui.picker);}
});
app.addEventListener('toggle',function(e){var el=e.target;if(el&&el.dataset&&el.dataset.wk!=null)ui.open[el.dataset.wk]=el.open;},true);

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act="export"],[data-act="import"]');if(!b)return;
  if(b.dataset.act==='export'){
    try{var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='plan-sotero-copia-'+todayS()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);toast('Copia guardada');}
    catch(err){toast('No se pudo crear la copia');}
  } else {var f=document.getElementById('imp');if(f)f.click();}
});
app.addEventListener('change',function(e){
  if(e.target.id!=='imp')return;
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o!=='object'||!o.weights)throw 0;S=mergeState(o);save();render();toast('Copia restaurada');}catch(err){toast('El archivo no es una copia válida');}};
  r.readAsText(file);
});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}catch(e){}
})();
</script>
</body>
</html>
